story_title: 'Cobertura recorrente da carteira e planejador semanal inteligente'
gate: FAIL
status_reason: 'A regeneração pela API/CLI falha antes do banco, e o reenvio não mantém um comando idempotente estável. Inclusão manual produz metadados de cobertura incompatíveis com o validador; requisitos de seleção, estratégia e verificação interativa também permanecem incompletos.'
