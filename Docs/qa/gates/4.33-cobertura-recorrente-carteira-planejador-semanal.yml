top_issues:
  - id: REL-433-001
    severity: high
    finding: 'Regenerar sempre lança ZodError: mutateWeeklyProposal passa o comando completo ao contrato estrito de generateWeeklyProposal. Reprodução direta confirmou unrecognized_keys para idempotencyKey, operation, proposalId e expectedVersion antes de qualquer RPC.'
    suggested_action: 'Projetar explicitamente schemaVersion, sellerId e weekStart para a geração; testar regenerate de rascunho e publicada pelo serviço e endpoint reais.'
    suggested_owner: dev
    refs: ['apps/web/src/server/route-proposals/service.ts:274', 'packages/contracts/src/weekly-route-proposals.ts:57']
  - id: REL-433-002
    severity: high
    finding: 'Após corrigir REL-433-001, a mesma intenção de regeneração ainda é recalculada com generatedAt e fontes novos em cada chamada; o SQL compara replay.command integralmente e retorna IDEMPOTENCY_KEY_REUSED. O replay pgTAP reutiliza o JSON interno pronto e não cobre o comando público reenviado em outro instante.'
    suggested_action: 'Vincular replay ao comando público estável antes de recalcular fontes/relógio, preservando resposta original e revalidando autorização; testar resposta perdida com a mesma chave e relógios/fontes diferentes.'
    suggested_owner: dev
    refs: ['apps/web/src/server/route-proposals/service.ts:134', 'apps/web/src/server/route-proposals/service.ts:274', 'supabase/migrations/20261116140000_story433_route_routine.sql:236']
  - id: REL-433-003
    severity: high
    finding: 'Adicionar cliente pela busca fabrica coverageState unavailable e lastCompletedVisitAt null. Em proposta com sources.visits available, a validação SQL exige never_visited ou a última conclusão real; a inclusão manual de cliente elegível, inclusive removido e readicionado, não pode ser salva.'
    suggested_action: 'Reutilizar ou obter os sinais canônicos do cliente incluído, mantendo o snapshot e recalculando contagens; testar remover/readicionar e adicionar cliente com e sem visita concluída.'
    suggested_owner: dev
    refs: ['apps/web/src/features/management/weekly-route-proposal-dashboard.tsx:196', 'apps/web/src/features/management/weekly-route-proposal-dashboard.tsx:206', 'supabase/migrations/20261116140000_story433_route_routine.sql:183']
  - id: REQ-433-001
    severity: medium
    finding: 'A lista permite selecionar clientes sem coordenadas, mas addMapSelection os elimina por candidate.location !== null, sem explicar o descarte. Endereço navegável permanece elegível no domínio; a alternativa textual não oferece o mesmo caminho de inclusão.'
    suggested_action: 'Permitir inclusão com localização pendente e validar trechos conhecidos no servidor; informar os motivos individuais quando um selecionado não puder entrar.'
    suggested_owner: dev
    refs: ['apps/web/src/features/management/weekly-route-proposal-dashboard.tsx:222', 'apps/web/src/features/management/weekly-route-planning-map.tsx:377']
  - id: REQ-433-002
    severity: medium
    finding: 'AC 5/7 não estão completos: o mapa não oferece filtro de débito oficial de sucata; contrato/CLI/UI não recebem estratégia/região revisada pelo gestor, e a viagem tem region null. O dashboard apresenta totais agregados, sem relação dos clientes pendentes com motivo por incompatibilidade.'
    suggested_action: 'Completar filtro de sucata, revisão explícita da estratégia/agrupamento e apresentação dos clientes pendentes com razões e fontes; usar o motor canônico para regenerar a preferência revisada.'
    suggested_owner: dev
    refs: ['apps/web/src/features/management/weekly-route-planning-map.tsx:324', 'packages/contracts/src/weekly-route-proposals.ts:195', 'packages/domain/src/weekly-route-proposals.ts:228', 'apps/web/src/features/management/weekly-route-proposal-dashboard.tsx:313']
  - id: REL-433-004
    severity: medium
    finding: 'A classificação semanal compara a distância arredondada a uma casa decimal com 80 km. Reprodução com distância real de 79,99 km resultou em strategy.kind trip e distanceFromBaseKm 80, enquanto classifyDailyRoute retornou local para a mesma parada.'
    suggested_action: 'Usar distância sem arredondamento nas decisões e arredondar somente para apresentação; testar 79,99/80/80,01 km em ambos os classificadores.'
    suggested_owner: dev
    refs: ['packages/domain/src/weekly-route-proposals.ts:105', 'packages/domain/src/weekly-route-proposals.ts:184', 'packages/domain/src/weekly-route-proposals.ts:188']
  - id: TEST-433-001
    severity: medium
    finding: 'Os 34 testes direcionados passam, mas o serviço não testa regenerate e o dashboard só é renderizado estaticamente. O único E2E usa nomes curtos, círculo numérico e fecha o popup antes de 390 px; não demonstra drag/toque, preservação da instância/centro/zoom, dirty/save/conflito/descartar, nem versão/composição efetivamente publicada.'
    suggested_action: 'Adicionar testes comportamentais de serviço e UI para os defeitos e para os cenários obrigatórios dos AC 9-15, incluindo falha de salvar e reenvio público idempotente.'
    suggested_owner: dev
    refs: ['apps/web/src/server/route-proposals/service.test.ts', 'apps/web/src/features/management/weekly-route-proposal-dashboard.test.tsx', 'tests/e2e/weekly-route-intelligence.spec.ts']
