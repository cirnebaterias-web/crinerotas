name: cirne-rotas-pilot

services:
  app:
    image: "${CIRNE_APP_IMAGE:?Defina CIRNE_APP_IMAGE com imagem imutavel por digest}"
    init: true
    env_file:
      - "${CIRNE_ENV_FILE:?Defina CIRNE_ENV_FILE com o arquivo privado do piloto}"
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0750,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/live',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - app_internal
      - egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.4-alpine
    init: true
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Defina APP_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Defina ACME_EMAIL}"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CIRNE_HTTP_PORT:-80}:80"
      - "${CIRNE_HTTPS_PORT:-443}:443"
      - "${CIRNE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - edge
      - app_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
  egress:
  app_internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
